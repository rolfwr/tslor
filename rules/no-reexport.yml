id: no-reexport
language: TypeScript
severity: error
message: "Re-export detected: run `tslor propose-import-directly .` to redirect consumers, then `tslor propose-purge-reexport .` to remove the unused re-export"
# Test files are excluded because tslor's tests use re-export fixtures
# to exercise tslor's own re-export analysis features. These are test
# scaffolding, not architectural re-exports.
files:
  - "**/*.ts"
  - "!**/*.test.ts"
rule:
  kind: export_statement
  all:
    - has:
        kind: export_clause
    - has:
        kind: string
